name: Articole zilnice

on:
  schedule:
    - cron: "12 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-articles
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Genereaza articole
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-2.5-flash"
          ARTICLES_PER_RUN: "6"
        run: node scripts/generate-articles.mjs

      - name: Commit si push
        run: |
          git config user.name "Cleaning Journal Bot"
          git config user.email "bot@cleaningjournal.com"
          git add src/posts/
          if git diff --staged --quiet; then
            echo "Nimic nou de publicat."
          else
            git commit -m "Articole noi automate"
            git push
          fi
